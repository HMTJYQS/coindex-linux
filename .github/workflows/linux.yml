name: Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      CODEX_TODO_CODEX: /usr/bin/true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Qt graphics and X11 runtime dependencies
        run: |
          . /etc/os-release
          COINDEX_GLIB_PACKAGE=libglib2.0-0
          if [ "$VERSION_ID" = "24.04" ]; then
            COINDEX_GLIB_PACKAGE=libglib2.0-0t64
          fi
          sudo apt-get update
          sudo apt-get install -y "$COINDEX_GLIB_PACKAGE" xvfb xauth \
            libegl1 libgl1 libopengl0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxrender1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-util1
      - name: Python dependencies
        run: python3 -m pip install --upgrade pip setuptools wheel && python3 -m pip install .
      - name: Require Qt Core, Gui, and Widgets before tests
        run: python3 -c "from PySide6 import QtCore, QtGui, QtWidgets; print('Qt runtime import OK:', QtCore.qVersion())"
      - name: Backend and Qt integration regression (no real model or nudge)
        run: python3 -m unittest discover -s tests -v
      - name: Build wheel and public source bundle; verify privacy inventory
        run: python3 scripts/build-linux.py
      - name: Download install dependencies for an isolated offline install
        run: python3 -m pip download --dest build/wheelhouse dist/Linux/*.whl pip
      - name: Install outside source checkout, launch demo, upgrade, uninstall
        shell: bash
        run: |
          TEST_HOME=$(mktemp -d)
          WHEEL=$(realpath dist/Linux/*.whl)
          WHEELHOUSE=$(realpath build/wheelhouse)
          PIP_WHEEL=$(realpath build/wheelhouse/pip-*.whl)
          HOME="$TEST_HOME" bash scripts/install-linux.sh "$WHEEL" --offline --find-links "$WHEELHOUSE" --pip-wheel "$PIP_WHEEL"
          cd /tmp
          HOME="$TEST_HOME" "$TEST_HOME/.local/bin/coindex-linux" --demo --smoke-test
          xvfb-run -a env QT_QPA_PLATFORM=xcb HOME="$TEST_HOME" "$TEST_HOME/.local/bin/coindex-linux" --demo --smoke-test
          cd "$GITHUB_WORKSPACE"
          HOME="$TEST_HOME" bash scripts/install-linux.sh "$WHEEL" --offline --find-links "$WHEELHOUSE" --pip-wheel "$PIP_WHEEL"
          HOME="$TEST_HOME" bash scripts/uninstall-linux.sh
          test ! -e "$TEST_HOME/.local/bin/coindex-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: coindex-linux-${{ matrix.os }}
          path: dist/Linux/*
          if-no-files-found: error
